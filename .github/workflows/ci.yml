name: CI

# PR'larda ve main'e gönderimde çalışır. Dal gönderimlerinde push tetiklenmez;
# böylece açık PR'daki her commit için CI iki kez çalışmaz.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Aynı PR'a yeni commit gelirse eski çalıştırma iptal edilir.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pip check, Ruff, pytest
    # Geliştirme ortamımızla aynı işletim sistemi (README: Windows, Python 3.11.9).
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Python 3.11.9 kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Bağımlılıkları kur
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Bağımlılık uyumu (pip check)
        run: python -m pip check

      - name: Kod stili (Ruff)
        run: python -m ruff check .

      - name: Testler (pytest)
        run: python -m pytest -v
